<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The crown, white on the brand red, because it is the only mark that
       survives 16px. The badge that was here filled the tab with an
       unreadable smudge: at that size the lion, the cap and the CKP type all
       collapse into one shape. Stroke is 4.2 rather than the component's 3.2
       — scaled down, 3.2 lands at 0.94px on a 16px tab and greys out. -->
  <circle cx="32" cy="32" r="32" fill="#b4170a"/>
  <g transform="translate(8.6 12.29) scale(1.17)" fill="#ffffff">
    <circle cx="7.5" cy="6.5" r="2.75"/>
    <circle cx="20" cy="3.75" r="3.25"/>
    <circle cx="32.5" cy="6.5" r="2.75"/>
    <path d="M6.4 11.4 9.6 31.6 19.9 17.8 30.5 31.6 33.6 11.4" fill="none"
          stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9.7 31.6 20 22.2 30.3 31.6" fill="none"
          stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
